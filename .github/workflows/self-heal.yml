name: Self-Heal Auto-Repair

on:
  schedule:
    - cron: '0 2 * * *' # AUTO-UPDATED
  workflow_run:
    workflows: ["Rust CI", "Claude Code"] # Using actual workflow names
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: selfheal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prevent Loops and Duplicates & Cleanup Stale
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref_name }}" == selfheal-* ]]; then
            echo "Skipping self-heal on a self-heal branch."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Close stale PRs older than 7 days
          stale_prs=$(gh pr list --label self-heal --state open --json number,createdAt --jq '.[] | select((now - (.createdAt | fromdate)) > 604800) | .number')
          for pr in $stale_prs; do
            echo "Closing stale self-heal PR #$pr"
            gh pr close "$pr" -c "Closing stale auto-repair PR."
          done

          count=$(gh pr list --label self-heal --state open --json number | jq length)
          if [ "$count" -gt 0 ]; then
            echo "Self-heal PR already exists. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Setup Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        if: steps.check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install -r requirements-dev.txt

      - name: Pre-healthcheck
        if: steps.check.outputs.skip != 'true'
        id: pre
        run: |
          python3 scripts/healthcheck.py > pre_healthcheck.log 2>&1 || echo "Healthcheck failed as expected"
          cat pre_healthcheck.log

      - name: Run Self-Heal
        if: steps.check.outputs.skip != 'true'
        id: heal
        run: |
          python3 scripts/self_heal.py > repair.log 2>&1
          cat repair.log

      - name: Post-healthcheck
        id: post
        if: steps.check.outputs.skip != 'true' && always()
        run: |
          python3 scripts/healthcheck.py > post_healthcheck.log 2>&1
          cat post_healthcheck.log

      - name: Check Diff
        if: steps.check.outputs.skip != 'true'
        id: diff
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_diff=true" >> $GITHUB_OUTPUT
          else
            echo "has_diff=false" >> $GITHUB_OUTPUT
          fi


      - name: Upload Logs
        if: steps.check.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-logs
          path: |
            pre_healthcheck.log
            repair.log
            post_healthcheck.log
          retention-days: 7

      - name: Security Gates
        id: security
        if: steps.check.outputs.skip != 'true' && steps.post.outcome == 'success' && steps.diff.outputs.has_diff == 'true'
        run: |
          echo "Checking for secrets in diff..."
          if git diff | grep -iE 'api[_-]?key|secret|token|password|bearer'; then
            echo "❌ Potential secrets detected in diff. Aborting."
            echo "pass=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Checking changed files..."
          changed_files=$(git diff --name-only)

          # Check for forbidden files
          for file in $changed_files; do
            if [[ "$file" == ".github/workflows/ci.yml" || "$file" == ".env"* || "$file" == *"secrets/"* || "$file" == *"migrations/"* ]]; then
              echo "❌ Modified forbidden file: $file. Aborting."
              echo "pass=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          # Check if changes are only in allowed areas
          for file in $changed_files; do
            if [[ ! "$file" =~ ^(src/|tests/|rust/crates/|scripts/|requirements.*\.txt|Cargo\.(toml|lock)|SELF_HEAL.*) ]]; then
              echo "❌ Modified file outside allowed areas: $file. Aborting."
              echo "pass=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "pass=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check.outputs.skip != 'true' && steps.post.outcome == 'success' && steps.diff.outputs.has_diff == 'true' && steps.security.outputs.pass == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create unique branch
          BRANCH="selfheal-$(date +%s)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Auto-repair drift"
          git push -u origin "$BRANCH"

          # Determine title based on trigger
          if [ "${{ github.event_name }}" == "schedule" ]; then
            TITLE="[Self-Heal Scheduled] Drift fixes"
          elif [ "${{ github.event_name }}" == "workflow_run" ]; then
            TITLE="[Self-Heal Reactive] CI fix"
          else
            TITLE="[Self-Heal Manual] Repair"
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh pr create \
            --title "$TITLE" \
            --body "Auto-generated self-heal PR. Please review. \n\n**Trigger:** ${{ github.event_name }} \n\n[View Artifact Logs]($RUN_URL)" \
            --label "self-heal,automation"
