name: Self-Heal Automation

on:
  schedule:
    - cron: '0 0 * * *' # AUTO-UPDATED
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: selfheal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: |
      !startsWith(github.ref_name, 'selfheal-') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install self-heal dependencies
        run: pip install -r requirements-selfheal.txt

      - name: Close stale self-heal PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Cleanup PRs older than 7 days
          STALE_PRS=$(gh pr list --label self-heal --state open --json number,createdAt | jq -r '.[] | select((.createdAt | fromdateiso8601) < (now - 604800)) | .number')
          for PR in $STALE_PRS; do
            echo "Closing stale PR #$PR"
            gh pr close $PR --comment "Auto-closing stale self-heal PR."
          done

      - name: Check for duplicate PRs
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RECENT_PRS=$(gh pr list --label self-heal --state open --json createdAt -q 'length')
          if [ "$RECENT_PRS" -gt 0 ]; then
            echo "duplicate=true" >> $GITHUB_OUTPUT
            echo "Found open self-heal PRs. Skipping to prevent duplicates."
          else
            echo "duplicate=false" >> $GITHUB_OUTPUT
          fi

      - name: Pre-repair Healthcheck
        if: steps.check_pr.outputs.duplicate == 'false'
        continue-on-error: true
        run: python3 scripts/healthcheck.py > pre_healthcheck.log 2>&1

      - name: Run repair pipeline
        if: steps.check_pr.outputs.duplicate == 'false'
        id: repair
        run: python3 scripts/self_heal.py > repair_pipeline.log 2>&1

      - name: Post-repair Healthcheck
        if: always() && steps.check_pr.outputs.duplicate == 'false'
        run: python3 scripts/healthcheck.py > post_healthcheck.log 2>&1

      - name: Upload Artifacts
        if: always() && steps.check_pr.outputs.duplicate == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: repair-logs
          path: |
            pre_healthcheck.log
            repair_pipeline.log
            post_healthcheck.log

      - name: Set PR metadata
        if: steps.repair.outcome == 'success' && steps.check_pr.outputs.duplicate == 'false'
        id: meta
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "title=[Self-Heal Scheduled] Drift fixes" >> $GITHUB_OUTPUT
            echo "reason=scheduled run" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "title=[Self-Heal Reactive] CI fix" >> $GITHUB_OUTPUT
            echo "reason=CI failure reaction" >> $GITHUB_OUTPUT
          else
            echo "title=[Self-Heal Manual] Repair" >> $GITHUB_OUTPUT
            echo "reason=manual dispatch" >> $GITHUB_OUTPUT
          fi

      - name: Verify file changes and Create Pull Request
        if: steps.repair.outcome == 'success' && steps.check_pr.outputs.duplicate == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="selfheal-$(date +%s)"
          git checkout -b $BRANCH
          git add .

          # Check for changes in forbidden directories
          if git diff --cached --name-only | grep -E '^\.github/workflows/ci\.yml|^\.env|^secrets/|migrations/'; then
             echo "Forbidden changes detected. Aborting."
             exit 1
          fi

          # Scan for secrets conceptually
          if git diff --cached | grep -iE 'api_key|token|secret'; then
             echo "Possible secrets detected in diff. Aborting PR creation."
             exit 1
          fi

          git commit -m "${{ steps.meta.outputs.title }}"

          git push origin $BRANCH

          gh pr create \
            --title "${{ steps.meta.outputs.title }}" \
            --body "Automated repair PR triggered by ${{ steps.meta.outputs.reason }}. Review current schedule in \`.github/self-heal-schedule.yml\`. Drift summary and artifact logs can be viewed in the GitHub Actions run artifacts." \
            --label "self-heal" \
            --label "automation"
