name: auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  pull-requests: write
  contents: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    # Skip fork PRs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Wait for CI checks to initialize
        run: sleep 300

      - name: Wait for checks to complete
        uses: actions/github-script@v7.0.1
        id: wait-checks
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Wait up to 5 minutes for checks to complete
            for (let i = 0; i < 10; i++) {
              await new Promise(r => setTimeout(r, 30000));

              const { data: checkRuns } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: pr.head.sha
              });

              // Filter out the auto-merge check itself
              const relevantChecks = checkRuns.check_runs.filter(check => check.name !== 'auto-merge');
              const allCompleted = relevantChecks.every(check => check.status === 'completed');

              if (allCompleted) {
                const allSuccess = relevantChecks.every(check =>
                  check.conclusion === 'success' || check.conclusion === 'skipped'
                );
                if (allSuccess) {
                  console.log("All checks passed!");
                  return true;
                } else {
                  console.log("Some checks failed.");
                  core.setFailed("Checks failed.");
                  return false;
                }
              }
              console.log("Waiting for checks to complete...");
            }
            core.setFailed("Timed out waiting for checks.");
            return false;
