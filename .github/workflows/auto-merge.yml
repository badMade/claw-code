name: auto-merge


on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]


permissions:
  pull-requests: write
  contents: write
  checks: read
  statuses: read


jobs:
  auto-merge:
    # Skip fork PRs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Wait for CI checks to initialize
        run: sleep 300


      - name: Wait for checks to complete
        uses: actions/github-script@v7.0.1
        id: wait-checks
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = pr.head.sha;

            // Wait up to 5 minutes for checks to complete
            for (let i = 0; i < 10; i++) {
              await new Promise(r => setTimeout(r, 30000));

              const { data: checkRuns } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref,
              });

              // Filter out this specific check run so it doesn't wait for itself
              const relevantRuns = checkRuns.check_runs.filter(run => run.name !== context.workflow && run.name !== context.job && run.name !== 'auto-merge');

              // Check if any run is still in progress
              const inProgress = relevantRuns.some(run => run.status !== 'completed');
              if (!inProgress) {
                // Determine if all completed checks were successful
                const allSuccessful = relevantRuns.every(
                  run => run.conclusion === 'success' || run.conclusion === 'neutral' || run.conclusion === 'skipped'
                );

                if (allSuccessful) {
                  return 'success';
                } else {
                  core.setFailed('Some CI checks failed.');
                  return 'failure';
                }
              }
            }
            core.setFailed('CI checks did not complete in time.');
            return 'timeout';
