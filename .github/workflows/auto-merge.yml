name: auto-merge


on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]


permissions:
  pull-requests: write
  contents: write
  checks: read
  statuses: read


jobs:
  auto-merge:
    # Skip fork PRs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Wait for CI checks to initialize
        run: sleep 300


      - name: Wait for checks to complete
        uses: actions/github-script@v7.0.1
        id: wait-checks
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;


            // Wait up to 5 minutes for checks to complete
            for (let i = 0; i < 10; i++) {
              await new Promise(r => setTimeout(r, 30000));


              const { data: checkRuns } = await github.rest.checks.listForRef({
                owner, repo,
                ref: pr.head.sha
              });

              const completedChecks = checkRuns.check_runs.filter(c => c.status === 'completed');

              if (completedChecks.length === checkRuns.total_count && checkRuns.total_count > 0) {
                const failedChecks = completedChecks.filter(c => c.conclusion !== 'success' && c.conclusion !== 'skipped' && c.conclusion !== 'neutral');
                if (failedChecks.length > 0) {
                  core.setFailed(`Some checks failed: ${failedChecks.map(c => c.name).join(', ')}`);
                  return;
                }
                console.log('All checks passed!');
                return;
              }
              console.log(`Waiting for checks to complete... (${completedChecks.length}/${checkRuns.total_count})`);
            }
            core.setFailed('Timeout waiting for checks to complete');
