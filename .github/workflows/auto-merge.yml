name: auto-merge


on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]


permissions:
  pull-requests: write
  contents: write
  checks: read
  statuses: read


jobs:
  auto-merge:
    # Skip fork PRs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Wait for CI checks to initialize
        run: sleep 300


      - name: Wait for checks to complete
        uses: actions/github-script@v7.0.1
        id: wait-checks
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;


            // Wait up to 5 minutes for checks to complete
            for (let i = 0; i < 10; i++) {
              await new Promise(r => setTimeout(r, 30000));


              const { data: checkRuns } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: pr.head.sha
              });

              // Exclude this action's check run if it is still running
              const allChecksCompleted = checkRuns.check_runs.every(
                (check) => check.name === 'auto-merge' || check.status === 'completed'
              );

              if (allChecksCompleted) {
                const allChecksSuccessful = checkRuns.check_runs.every(
                  (check) => check.name === 'auto-merge' || check.conclusion === 'success' || check.conclusion === 'skipped'
                );

                if (allChecksSuccessful) {
                  return true;
                } else {
                  console.log("Some checks failed.");
                  return false;
                }
              }
              console.log("Checks still running. Waiting...");
            }
            console.log("Timed out waiting for checks.");
            return false;

      - name: Auto-merge PR
        if: steps.wait-checks.outputs.result == 'true' && contains(github.event.pull_request.labels.*.name, 'self-heal-schedule')
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'squash'
            });
