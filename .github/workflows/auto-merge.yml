name: auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  pull-requests: write
  issues: write
  contents: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    # Skip fork PRs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Wait for CI checks to initialize
        run: sleep 300

      - name: Wait for checks to complete
        uses: actions/github-script@v7.0.1
        id: wait-checks
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = pr.head.sha;

            // Expose the validated head SHA so later steps gate on (and merge)
            // the exact commit that was checked here, not a stale or moved head.
            core.setOutput('head_sha', headSha);

            // Best-effort wait (up to ~5 min) for external checks to finish.
            // We never fail the run here: the check-status step is the single
            // gate and it defers (without failing) while checks are pending, so
            // a timeout simply leaves merging to a later run. Breaking when
            // nothing is pending also covers the "no checks configured" case so
            // we don't burn the whole window unnecessarily.
            for (let i = 0; i < 10; i++) {
              const { data: checkRuns } = await github.rest.checks.listForRef({
                owner, repo, ref: headSha, per_page: 100,
              });

              // Ignore this workflow's own check run.
              const externalChecks = checkRuns.check_runs.filter(c => c.name !== 'auto-merge');
              const pending = externalChecks.filter(c => c.status !== 'completed');
              if (pending.length === 0) {
                break;
              }

              await new Promise(r => setTimeout(r, 30000));
            }

      - name: Check CI status and reviews
        uses: actions/github-script@v7.0.1
        id: check-status
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;
            const expectedHeadSha = '${{ steps.wait-checks.outputs.head_sha }}';
            const runUrl = 'https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId;

            // Upsert a single "auto-merge status" comment (find-by-marker +
            // update) so repeated runs don't spam the PR with near-duplicates.
            const marker = '<!-- auto-merge-status -->';
            async function postStatus(message) {
              const body = message + '\n\n[Workflow run](' + runUrl + ')\n\n' + marker;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            }

            // Re-fetch PR to get current state.
            const { data: currentPR } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });

            if (currentPR.state !== 'open') {
              core.setOutput('should_merge', 'false');
              core.setOutput('reason', 'PR is no longer open');
              return;
            }

            // Bail if the head moved since wait-checks validated it.
            if (expectedHeadSha && currentPR.head.sha !== expectedHeadSha) {
              core.setOutput('should_merge', 'false');
              core.setOutput('reason', 'head_sha_changed');
              return;
            }

            // Fetch all CI checks (paginate so we never miss a run in repos
            // with many jobs). octokit normalizes checks.listForRef pages to the
            // check_runs array, but guard for both shapes so each element is a
            // check-run object (never undefined) before we filter on it.
            const checkRuns = await github.paginate(
              github.rest.checks.listForRef,
              { owner, repo, ref: expectedHeadSha || currentPR.head.sha, per_page: 100 },
              (response) => (Array.isArray(response.data) ? response.data : response.data.check_runs),
            );
            const externalChecks = checkRuns.filter(c => c.name !== 'auto-merge');

            if (externalChecks.length === 0) {
              await postStatus('⚠️ **Auto-merge skipped**: No CI checks detected. Please ensure CI is configured.');
              core.setOutput('should_merge', 'false');
              core.setOutput('reason', 'no_checks');
              return;
            }

            // Defer (do not fail the run) while any external check is still
            // running. Check completion doesn't emit a pull_request event, so
            // this run won't auto-resume on its own; by design we rely on the
            // next PR event to re-evaluate — typically the `reviewed` label
            // being added after CI is green, which fires a fresh run that merges.
            const pendingChecks = externalChecks.filter(c => c.status !== 'completed');
            if (pendingChecks.length > 0) {
              const pendingNames = pendingChecks.map(c => c.name).join(', ');
              await postStatus('⏳ **Auto-merge pending**: CI checks are still running: ' + pendingNames);
              core.setOutput('should_merge', 'false');
              core.setOutput('reason', 'checks_pending');
              return;
            }

            const failedChecks = externalChecks.filter(
              c => !['success', 'skipped', 'neutral'].includes(c.conclusion)
            );
            if (failedChecks.length > 0) {
              const failedNames = failedChecks.map(c => c.name).join(', ');
              await postStatus('❌ **Auto-merge blocked**: The following checks did not pass: ' + failedNames);
              core.setOutput('should_merge', 'false');
              core.setOutput('reason', 'checks_failed');
              return;
            }

            // Require at least one review or review comment (human or bot)
            // before merging.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const hasReviews = reviews.length > 0 || reviewComments.length > 0;

            const labels = currentPR.labels.map(l => l.name);
            const hasReviewedLabel = labels.includes('reviewed');

            if (!hasReviews) {
              await postStatus('⏳ **Auto-merge pending**: No reviews detected yet. Waiting for review feedback.');
              core.setOutput('should_merge', 'false');
              core.setOutput('reason', 'pending_reviews');
              return;
            }

            const reviewerNames = [...new Set([
              ...reviews.map(r => r.user.login),
              ...reviewComments.map(r => r.user.login),
            ])];

            if (!hasReviewedLabel) {
              await postStatus('👀 **Reviews detected but awaiting confirmation**: ' + reviewerNames.length + ' reviewer(s) (' + reviewerNames.join(', ') + ') have provided feedback. Add the `reviewed` label to confirm review acceptance and trigger auto-merge.');
              core.setOutput('should_merge', 'false');
              core.setOutput('reason', 'awaiting_label');
              return;
            }

            // All conditions met.
            core.setOutput('should_merge', 'true');
            core.setOutput('reviewer_count', reviewerNames.length.toString());
            core.setOutput('reviewer_names', reviewerNames.join(', '));

      - name: Wait for GitHub state consistency
        if: steps.check-status.outputs.should_merge == 'true'
        run: sleep 60

      - name: Squash merge
        if: steps.check-status.outputs.should_merge == 'true'
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;
            const reviewerCount = '${{ steps.check-status.outputs.reviewer_count }}';
            const reviewerNames = '${{ steps.check-status.outputs.reviewer_names }}';
            const headSha = '${{ steps.wait-checks.outputs.head_sha }}' || pr.head.sha;
            const runUrl = 'https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId;

            const marker = '<!-- auto-merge-status -->';
            async function postStatus(message) {
              const body = message + '\n\n[Workflow run](' + runUrl + ')\n\n' + marker;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            }

            try {
              // Pin the merge to the head SHA validated above. If new commits
              // landed during the run, GitHub rejects the merge (409) and the
              // catch block reports it, avoiding merging an unchecked commit.
              await github.rest.pulls.merge({
                owner, repo, pull_number: prNumber,
                sha: headSha,
                merge_method: 'squash',
              });
              await postStatus('✅ **Auto-merged** via squash merge. ' + reviewerCount + ' reviewer(s) (' + reviewerNames + ') provided feedback.');
            } catch (error) {
              await postStatus('❌ **Auto-merge failed**: ' + error.message);
              // A 409 means the head moved after validation (expected race) and
              // is non-fatal. Surface any other error as a failed run so real
              // problems (permissions, branch protection, etc.) aren't hidden.
              if (error.status !== 409) {
                core.setFailed('Auto-merge failed: ' + error.message);
              }
            }
