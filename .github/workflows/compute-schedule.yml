name: Recompute Self-Heal Schedule

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly recalculation
  workflow_dispatch:

concurrency:
  group: schedule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recompute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-selfheal.txt

      - name: Check for duplicate PRs
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RECENT_PRS=$(gh pr list --label self-heal-schedule --state open --json createdAt -q 'length')
          if [ "$RECENT_PRS" -gt 0 ]; then
            echo "duplicate=true" >> $GITHUB_OUTPUT
            echo "Found open schedule update PR. Skipping."
          else
            echo "duplicate=false" >> $GITHUB_OUTPUT
          fi

      - name: Run compute script
        if: steps.check_pr.outputs.duplicate == 'false'
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/compute_schedule.py

          # Propagate the new schedule to the workflow YAML using a robust sed replacement on the `# AUTO-UPDATED` marker
          NEW_CRON=$(grep -oP '(?<=schedule: ).*' .github/self-heal-schedule.yml | tr -d '"'\')
          if [ -n "$NEW_CRON" ]; then
            sed -i "s|.*# AUTO-UPDATED|- cron: '$NEW_CRON' # AUTO-UPDATED|" .github/workflows/self-heal.yml
          fi

          if [[ -n $(git status --porcelain) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.compute.outputs.changed == 'true' && steps.check_pr.outputs.duplicate == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="schedule-update-$(date +%s)"
          git checkout -b $BRANCH
          git add .github/self-heal-schedule.yml .github/workflows/self-heal.yml
          git commit -m "[Self-Heal Schedule] Update cadence"
          git push origin $BRANCH

          gh pr create \
            --title "[Self-Heal Schedule] Update cadence" \
            --body "Automated PR to update the self-heal schedule based on recent PR telemetry." \
            --label "self-heal-schedule" \
            --label "automation"
