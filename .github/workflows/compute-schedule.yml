name: Self-Heal Schedule Computation

on:
  schedule:
    - cron: '0 0 * * 0' # Run once a week
  workflow_dispatch:

jobs:
  compute-schedule:
    name: Compute Optimal Schedule
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruamel.yaml pyyaml

      - name: Run Schedule Computation
        id: compute
        run: |
          ./scripts/compute_schedule.py

      - name: Check for Modifications
        id: git_status
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for Open PRs
        id: check_prs
        if: steps.git_status.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_prs=$(gh pr list --label "self-heal-schedule" --state open --json number -q 'length')
          if [ "$open_prs" -gt "0" ]; then
            echo "duplicate=true" >> $GITHUB_OUTPUT
          else
            echo "duplicate=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.git_status.outputs.changes == 'true' && steps.check_prs.outputs.duplicate == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="selfheal-schedule-$(date +%Y%m%d%H%M%S)"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add .github/self-heal-schedule.yml .github/workflows/self-heal.yml
          git commit -m "Update self-healing cadence"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "[Self-Heal Schedule] Update cadence" \
            --body "Automated update to the self-healing workflow schedule based on recent repository telemetry." \
            --label "self-heal-schedule,automation" \
            --head "$BRANCH_NAME" \
            --base main
